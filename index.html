<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Rhinoforum 2026 — Programme</title>
<meta name="theme-color" content="#7b1e3b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rhinoforum" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  html { background: #7b1e3b; }
  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #241a1c; overflow: hidden;
    --bg:#f2ebe2; --surface:#fffdf9; --ink:#241a1c; --ink2:#7d6a61; --line:#e8ddd0;
    --accent:#7b1e3b; --gold:#9a7b3f; --appbar:#7b1e3b; --appbar-ink:#f6ebe0;
    --display:"Spectral",Georgia,serif; --radius:12px;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* shell plein écran */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden;
    font-size: 15px; line-height: 1.4; background: var(--bg); color: var(--ink); }

  /* status bar */
  .statusbar { height: calc(20px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); display: flex; align-items: center; justify-content: space-between; padding-left: 26px; padding-right: 26px; font-size: 13.5px; font-weight: 600; flex-shrink: 0; background: var(--appbar); color: var(--appbar-ink); }
  .statusbar .sb-r { display: flex; align-items: center; gap: 5px; }
  .statusbar .dot3 { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; opacity: .85; }

  /* app bar */
  .appbar { background: var(--appbar); color: var(--appbar-ink); flex-shrink: 0; box-shadow: 0 2px 0 rgba(154,123,63,.5); z-index: 6; }
  .appbar-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #b94a63 0%, #7b1e3b 55%, #571026 100%); box-shadow: inset 0 0 0 1.5px rgba(246,235,224,.35); flex-shrink: 0; }
  .brand-name { font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1; }
  .brand-name span { color: var(--gold); }
  .brand-sub { font-size: 11px; opacity: .72; margin-top: 3px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--appbar-ink); background: rgba(255,255,255,.1); }

  .searchbar { padding: 0 16px 12px; position: relative; }
  .searchbar input { width: 100%; height: 40px; border-radius: 11px; border: none; padding: 0 38px 0 14px; font-size: 16px; background: rgba(255,255,255,.16); color: var(--appbar-ink); }
  .searchbar input::placeholder { color: rgba(246,235,224,.6); }
  .clearq { position: absolute; right: 26px; top: 8px; width: 24px; height: 24px; font-size: 20px; color: rgba(246,235,224,.8); }

  .daybar { display: flex; align-items: center; gap: 10px; padding: 0 16px 12px; }
  .days { display: flex; gap: 6px; flex: 1; }
  .day { flex: 1; height: 46px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: rgba(255,255,255,.12); color: rgba(246,235,224,.82); transition: .15s; }
  .day-d { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .day-n { font-size: 17px; font-weight: 650; font-family: var(--display); }
  .day.on { background: #fffdf9; color: var(--accent); box-shadow: 0 4px 12px -4px rgba(0,0,0,.35); }
  .filter-btn { position: relative; width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.12); color: var(--appbar-ink); flex-shrink: 0; }
  .filter-btn.has { background: var(--gold); color: #fff; }
  .fcount { position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #fff; color: var(--accent); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.3); }

  .chips-active { display: flex; gap: 6px; padding: 0 16px 11px; overflow-x: auto; }
  .chips-active::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 12px; padding: 5px 6px 5px 11px; border-radius: 14px; background: rgba(255,255,255,.16); color: var(--appbar-ink); font-weight: 500; }
  .chip button { font-size: 15px; line-height: 1; opacity: .8; width: 16px; }
  .chip-clear { white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--appbar-ink); text-decoration: underline; padding: 5px 6px; opacity: .9; }

  /* body */
  .screen-body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; background: var(--bg); }
  .screen-body::-webkit-scrollbar { width: 0; }

  .list { padding: 8px 14px 24px; }
  .result-note { font-size: 12px; color: var(--ink2); padding: 8px 4px 4px; }
  .slot { margin-top: 14px; }
  .slot-head { display: flex; align-items: center; gap: 10px; padding: 4px 2px 9px; position: sticky; top: 0; background: linear-gradient(var(--bg) 70%, transparent); z-index: 2; }
  .slot-time { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink); }
  .slot-rule { flex: 1; height: 1px; background: var(--line); }
  .slot-count { font-size: 11.5px; color: var(--ink2); white-space: nowrap; }
  .slot-head.live .slot-time { color: var(--accent); }
  .slot-head.live .slot-count { color: var(--accent); font-weight: 600; }

  .card { position: relative; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 9px; overflow: hidden; box-shadow: 0 1px 2px rgba(80,40,30,.04); transition: transform .12s; }
  .card:active { transform: scale(.985); }
  .card-bar { width: 4px; flex-shrink: 0; background: var(--c-bar); }
  .card-main { flex: 1; padding: 12px 4px 12px 12px; min-width: 0; }
  .card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; flex-wrap: wrap; }
  .theme-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--c-text); }
  .fmt-pill { font-size: 10.5px; font-weight: 500; color: var(--ink2); background: color-mix(in srgb, var(--c-tint) 70%, transparent); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .live-pill { font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); padding: 2px 7px; border-radius: 6px; letter-spacing: .02em; }
  .card-title { font-family: var(--display); font-size: 15px; font-weight: 600; line-height: 1.28; margin: 0 0 8px; color: var(--ink); letter-spacing: -.005em; text-wrap: pretty; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--ink2); }
  .card-meta .m-time { font-weight: 600; color: color-mix(in srgb, var(--ink) 70%, transparent); }
  .card-meta i { font-style: normal; opacity: .6; }
  .m-room, .m-sp { display: inline-flex; gap: 3px; }
  .star { flex-shrink: 0; width: 44px; align-self: stretch; font-size: 21px; color: #cfc8bf; display: flex; align-items: flex-start; justify-content: center; padding-top: 11px; }
  .star.on { color: #d9a32a; }
  .list-end { text-align: center; font-size: 11px; color: var(--ink2); opacity: .7; padding: 22px 0 6px; }

  .empty { padding: 60px 34px; text-align: center; color: var(--ink2); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .empty-em { font-size: 44px; color: var(--line); line-height: 1; }
  .empty p { font-size: 16px; font-weight: 600; color: var(--ink); margin: 6px 0 0; }
  .empty span { font-size: 13px; line-height: 1.5; max-width: 250px; }
  .empty .btn-primary { margin-top: 14px; }

  /* grille */
  .grid-wrap { display: flex; flex-direction: column; height: 100%; }
  .grid-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
  .grid-inner { position: relative; }
  .grid-head { position: sticky; top: 0; z-index: 5; display: flex; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
  .ghead-axis { flex-shrink: 0; position: sticky; left: 0; background: var(--surface); z-index: 6; }
  .ghead-room { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-left: 1px solid var(--line); }
  .gh-name { font-size: 12px; font-weight: 650; color: var(--ink); }
  .gh-cru { font-size: 9.5px; color: var(--ink2); }
  .grid-body { position: relative; }
  .g-tick { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line); }
  .g-tick.hour { border-top: 1px solid color-mix(in srgb, var(--line) 60%, var(--ink2)); }
  .g-tlabel { position: sticky; left: 0; display: inline-block; font-size: 10px; color: var(--ink2); background: var(--bg); padding: 1px 4px; transform: translateY(-7px); font-weight: 600; }
  .g-col { position: absolute; top: 0; bottom: 0; }
  .g-block { position: absolute; overflow: hidden; text-align: left; border-radius: 7px; background: var(--c-tint); border-left: 3px solid var(--c-bar); padding: 4px 5px; display: flex; flex-direction: column; gap: 1px; color: var(--ink); transition: transform .1s; }
  .g-block:active { transform: scale(.97); }
  .g-block.fav { box-shadow: 0 0 0 1.5px #d9a32a inset; }
  .gb-time { font-size: 9px; font-weight: 700; color: var(--c-text); }
  .gb-title { font-size: 10.5px; line-height: 1.18; font-weight: 550; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .g-block.tiny .gb-title { -webkit-line-clamp: 1; }
  .g-block.tiny { flex-direction: row; align-items: center; gap: 4px; }
  .gb-star { position: absolute; top: 2px; right: 3px; font-size: 10px; color: #d9a32a; }
  .now-line { position: absolute; right: 0; height: 0; border-top: 2px solid #d23; z-index: 4; display: flex; align-items: center; }
  .now-dot { width: 9px; height: 9px; border-radius: 50%; background: #d23; margin-left: -4px; margin-top: -2px; }
  .now-lb { font-size: 9px; font-weight: 700; color: #fff; background: #d23; padding: 1px 5px; border-radius: 4px; margin-left: 2px; margin-top: -1px; }
  .grid-hint { flex-shrink: 0; text-align: center; font-size: 11px; color: var(--ink2); padding: 7px; background: var(--surface); border-top: 1px solid var(--line); }

  /* mes sessions */
  .mine-body { padding: 14px 14px 28px; }
  .mine-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .mine-h { font-family: var(--display); font-size: 21px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .mine-sub { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
  .conflict-banner { display: flex; flex-direction: column; gap: 2px; background: color-mix(in srgb, #d23 12%, var(--surface)); border: 1px solid color-mix(in srgb, #d23 30%, transparent); border-radius: 12px; padding: 11px 13px; margin-bottom: 14px; }
  .conflict-banner strong { font-size: 13.5px; color: #b81e1e; }
  .conflict-banner span { font-size: 12px; color: var(--ink2); }
  .mine-day-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); padding: 12px 2px 8px; }
  .mine-card-wrap { position: relative; }
  .mine-card-wrap.conflict .card { border-color: color-mix(in srgb, #d23 45%, transparent); }
  .conflict-tag { position: absolute; top: -6px; left: 12px; z-index: 2; font-size: 9.5px; font-weight: 700; color: #fff; background: #d23; padding: 2px 7px; border-radius: 5px; letter-spacing: .03em; }

  .btn-primary { background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; border-radius: 11px; padding: 11px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; box-shadow: 0 6px 16px -8px rgba(123,30,59,.7); }
  .btn-primary.sm { padding: 8px 13px; font-size: 13px; border-radius: 10px; }
  .btn-primary.wide { width: 100%; padding: 14px; font-size: 15px; }
  .btn-primary.is-fav { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn-ghost { width: 50px; border-radius: 11px; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }

  /* tab bar */
  .tabbar { flex-shrink: 0; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 7px 8px calc(10px + env(safe-area-inset-bottom)); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink2); padding: 4px 0; }
  .tab.on { color: var(--accent); }
  .tab-ic { position: relative; display: flex; }
  .tab-lb { font-size: 10.5px; font-weight: 550; }
  .tab-badge { position: absolute; top: -5px; right: -9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  /* sheets */
  .sheet-back { position: fixed; inset: 0; background: rgba(20,12,14,.42); z-index: 40; display: flex; align-items: flex-end; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); animation: rise .26s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform: translateY(100%); } }
  .sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 14px; }
  .sheet-tags { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .theme-tag.big { font-size: 11px; padding: 3px 9px; border-radius: 7px; background: var(--c-tint); color: var(--c-text); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .sheet-title { font-family: var(--display); font-size: 21px; line-height: 1.25; font-weight: 600; margin: 0 0 16px; color: var(--ink); text-wrap: pretty; }
  .sheet-info { border-top: 1px solid var(--line); margin-bottom: 4px; }
  .d-row { display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .d-k { width: 86px; flex-shrink: 0; font-size: 12.5px; color: var(--ink2); }
  .d-v { font-size: 13.5px; color: var(--ink); font-weight: 500; }
  .sheet-sp { padding: 16px 0 8px; }
  .sp-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); margin-bottom: 10px; }
  .sp-list { display: flex; flex-wrap: wrap; gap: 7px; }
  .sp-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px 4px 4px; color: var(--ink); }
  .sp-av { width: 22px; height: 22px; border-radius: 50%; background: var(--c-bar); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 18px; position: sticky; bottom: 0; }
  .filter-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .filter-head h2 { font-family: var(--display); font-size: 20px; font-weight: 600; margin: 0; }
  .lnk { font-size: 13px; color: var(--accent); font-weight: 600; }
  .filter-scroll { max-height: 50vh; overflow-y: auto; margin: 8px -4px 14px; padding: 0 4px; }
  .fgroup { margin-bottom: 18px; }
  .fgroup-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); margin-bottom: 9px; }
  .fgroup-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 7px 12px; border-radius: 20px; background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
  .fchip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fc); }
  .fchip.on { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  @media (min-width: 620px) {
    /* sur desktop : centrer dans un cadre téléphone pour rester lisible */
    html, body { background: #cfccc6; }
    #app { max-width: 460px; margin: 0 auto; inset: 0; border-left: 1px solid rgba(0,0,0,.08); border-right: 1px solid rgba(0,0,0,.08); }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="data.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
